<?xml version="1.0" encoding="UTF-8"?>
<!--
  FICHA DE PERSONAJE (esqueleto editable en Inkscape).

  Es la hoja de seguimiento del héroe durante la partida: registrar el daño
  (cuerpo/mente), las armas y objetos que lleva y el oro que acumula. Es
  distinta de la carta de stats (`anverso_stats.svg`), que solo describe al
  héroe.

  Las zonas de la ficha se declaran como anclas `id="ph-*"` y los textos
  variables como marcadores `{{...}}` (contrato en scripts/plantillas.py y en
  README.md). La geometría de cada ancla la usa el código que rellena la ficha;
  puedes moverlas/redimensionarlas en Inkscape sin romper nada.

  Anclas propuestas (ajusta en Inkscape):
    id="ph-retrato"   retrato del héroe (fuente: sources/arte/<slug>.png)
    id="ph-cuerpo"    marcadores de Puntos de Cuerpo (pips que se tachan)
    id="ph-mente"     marcadores de Puntos de Mente
    id="ph-armas"     lista de armas/objetos equipados (líneas para apuntar)
    id="ph-oro"       caja para anotar el oro

  Marcadores: {{NOMBRE}}, {{CLASE}}, {{ATAQUE}}, {{DEFENSA}}, {{MOVIMIENTO}}.
  Los valores de cuerpo y mente pueden ir en el texto ({{CUERPO}}, {{MENTE}})
  o como pips dibujados por el código dentro de las anclas.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <linearGradient id="fp-pergamino" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3ecdd" />
      <stop offset="100%" stop-color="#eadfc8" />
    </linearGradient>
    <linearGradient id="fp-caja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf4e3" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ecdcb8" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Fondo de pergamino -->
  <rect width="500" height="700" fill="url(#fp-pergamino)" />

  <!-- Marco doble -->
  <rect x="15" y="15" width="470" height="670" fill="none" stroke="#4d2c1b" stroke-width="4" />
  <rect x="22" y="22" width="456" height="656" fill="none" stroke="#4d2c1b" stroke-width="1" />

  <!-- Cabecera: nombre y clase -->
  <text x="250" y="62" font-family="'Albert Sans', Georgia, 'Times New Roman', serif"
        font-size="34" font-weight="bold" fill="#3a2416" text-anchor="middle">{{NOMBRE}}</text>
  <text x="250" y="88" font-family="'Albert Sans', Georgia, 'Times New Roman', serif"
        font-size="16" font-variant="small-caps" fill="{{COLOR}}" text-anchor="middle">{{CLASE}}</text>

  <!-- ANCLA: retrato del héroe. El código coloca aquí la imagen (recorte "cover"). -->
  <rect id="ph-retrato" x="40" y="110" width="240" height="260" fill="{{COLOR}}" opacity="0.10" rx="12" />

  <!-- Panel de stats de referencia a la derecha del retrato -->
  <g font-family="'Albert Sans', Georgia, 'Times New Roman', serif" fill="#3a2416">
    <text x="310" y="140" font-size="15" font-weight="bold" font-variant="small-caps">Ataque:
      <tspan font-size="22" font-weight="bold">{{ATAQUE}}</tspan></text>
    <text x="310" y="180" font-size="15" font-weight="bold" font-variant="small-caps">Defensa:
      <tspan font-size="22" font-weight="bold">{{DEFENSA}}</tspan></text>
    <text x="310" y="220" font-size="15" font-weight="bold" font-variant="small-caps">Movimiento:
      <tspan font-size="22" font-weight="bold">{{MOVIMIENTO}}</tspan></text>
  </g>

  <!-- Puntos de Cuerpo (vidas). Pips que el jugador tacha al perder daño. -->
  <text x="40" y="404" font-family="'Albert Sans', Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="bold" font-variant="small-caps" fill="#4d2c1b">Puntos de cuerpo ({{CUERPO}})</text>
  <rect id="ph-cuerpo" x="40" y="414" width="420" height="48" fill="#000000" opacity="0.04" rx="8" />

  <!-- Puntos de Mente -->
  <text x="40" y="484" font-family="'Albert Sans', Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="bold" font-variant="small-caps" fill="#4d2c1b">Puntos de mente ({{MENTE}})</text>
  <rect id="ph-mente" x="40" y="494" width="420" height="48" fill="#000000" opacity="0.04" rx="8" />

  <!-- Armas y objetos equipados (líneas para apuntar) -->
  <text x="40" y="564" font-family="'Albert Sans', Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="bold" font-variant="small-caps" fill="#4d2c1b">Armas y equipo</text>
  <rect id="ph-armas" x="40" y="574" width="420" height="66" fill="#000000" opacity="0.04" rx="8" />

  <!-- Pie: caja de oro -->
  <text x="40" y="668" font-family="'Albert Sans', Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="bold" font-variant="small-caps" fill="#4d2c1b">Oro</text>
  <rect id="ph-oro" x="120" y="648" width="310" height="40" fill="url(#fp-caja)" stroke="#4d2c1b" stroke-width="1.5" rx="6" />
</svg>
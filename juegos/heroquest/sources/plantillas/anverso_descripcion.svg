<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   version="1.1"
   width="380"
   height="650"
   viewBox="0 0 380 650"
   xmlns="http://www.w3.org/2000/svg">
  <defs />
  <g>
    <!-- Arte -->
    <rect id="ph-arte" x="80" y="105" width="340" height="220" fill="none" stroke="#000" stroke-width="1" opacity="0.3" style="opacity:0" />
    <!-- Descripción -->
    <rect id="ph-descripcion" x="60" y="375" width="380" height="230" fill="none" stroke="#000" stroke-width="1" opacity="0.3" style="opacity:0" />
    <!-- Stats -->
    <rect id="ph-stats" x="60" y="608" width="380" height="24" fill="none" stroke="#000" stroke-width="1" opacity="0.3" style="opacity:0" />
    <!-- Nombre -->
    <text x="50" y="50" font-family="Albert Sans" font-size="24" fill="#3a2416" text-anchor="middle">{{NOMBRE}}</text>
    <!-- Subtítulo -->
    <text x="50" y="120" font-family="Albert Sans" font-size="14" fill="#3a2416" text-anchor="middle">{{SUBTITULO}}</text>
    <!-- Color de acento -->
    <rect x="0" y="0" width="1" height="1" fill="{{COLOR}}" />
  </g>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plantilla de REVERSO para la familia "stats" (heroes y monstruos).

  Igual que el reverso generico pero reserva una zona central para la
  DESCRIPCION: el heroe muestra aqui su descripcion (su anverso no la lleva);
  el monstruo no tiene descripcion, asi que la zona queda vacia.

  Sistema de plantillas (ver scripts/plantillas.py):
  - {{LEYENDA}} = categoria de la carta (heroe, enemigo).
  - Ancla id="ph-fondo" = imagen de fondo tematica del reverso.
  - Ancla id="ph-descripcion" = bloque de texto de la descripcion (multilinea,
    centrado). Si el tipo no aporta descripcion queda vacio.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <linearGradient id="vs-grad-pergamino" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3ecdd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eadfc8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo de pergamino de respaldo (si no hay imagen tematica) -->
  <rect width="500" height="700" fill="url(#vs-grad-pergamino)" />

  <!-- ANCLA: imagen de fondo tematica del reverso (cubre toda la carta) -->
  <rect id="ph-fondo" x="0" y="0" width="500" height="700" fill="#000000" opacity="0.04" />

  <!-- Doble marco -->
  <rect x="12" y="12" width="476" height="676" fill="none" stroke="#4d2c1b" stroke-width="3" />
  <rect x="20" y="20" width="460" height="660" fill="none" stroke="#4d2c1b" stroke-width="1" />

  <!-- Banner superior: "HeroQuest" -->
  <path d="M 110 40 H 390 L 370 75 L 390 110 H 110 L 130 75 Z"
        fill="#f4e9d2" fill-opacity="0.92" stroke="#4d2c1b" stroke-width="1.5" />
  <text x="250" y="82" font-family="'Albert Sans', Georgia, 'Times New Roman', serif" font-size="34"
        font-weight="bold" fill="#3a2416" text-anchor="middle">HeroQuest</text>

  <!-- Panel central para la descripcion (fondo semitransparente para legibilidad) -->
  <rect x="55" y="230" width="390" height="300" rx="10" fill="#f4e9d2" fill-opacity="0.85"
        stroke="#4d2c1b" stroke-width="1.5" />

  <!-- ANCLA: bloque de descripcion (multilinea, centrado dentro del panel) -->
  <rect id="ph-descripcion" x="75" y="255" width="350" height="250" fill="#000000" opacity="0.04" />

  <!-- Banda inferior: leyenda (categoria de la carta) -->
  <path d="M 120 580 H 380 L 358 602 L 380 624 H 120 L 142 602 Z"
        fill="#f4e9d2" fill-opacity="0.92" stroke="#4d2c1b" stroke-width="1.5" />
  <text x="250" y="606" font-family="'Albert Sans', Georgia, 'Times New Roman', serif" font-size="14"
        font-weight="bold" font-variant="small-caps" fill="#3a2416"
        text-anchor="middle">{{LEYENDA}}</text>
</svg>

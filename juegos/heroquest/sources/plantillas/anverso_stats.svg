<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plantilla de ANVERSO para la familia "stats" (heroes y monstruos).

  Diseno: el ARTE ocupa la carta hasta el borde inferior. El nombre va en un
  banner arriba sobre el arte, y el cuadro de estadisticas se dibuja
  SUPERPUESTO sobre el arte, en la banda inferior. No lleva descripcion en el
  anverso (la del heroe va en su reverso).

  Sistema de plantillas (ver scripts/plantillas.py):
  - Marcadores de texto {{...}} dentro de <text>/<tspan> se sustituyen por su
    valor (ya escapado). {{COLOR}} es el color de acento del tipo de carta.
  - Elementos "ancla" con id="ph-*" son cajas invisibles cuya GEOMETRIA
    (x,y,width,height) lee el codigo para colocar contenido generado encima:
      * id="ph-arte"  -> area de arte (imagen del heroe/monstruo), hasta abajo
      * id="ph-stats" -> caja donde se coloca el cuadro de estadisticas
        (plantilla aparte: stats_cuadro.svg), superpuesto sobre el arte
    Puedes mover/redimensionar estas cajas en Inkscape; su relleno aqui es solo
    una guia y no se dibuja en la carta final.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <linearGradient id="ps-grad-pergamino" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3ecdd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eadfc8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ps-grad-banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf4e3" />
      <stop offset="100%" stop-color="#ecdcc0" />
    </linearGradient>
  </defs>

  <!-- Fondo de pergamino (por si el arte no cubre del todo) -->
  <rect width="500" height="700" fill="url(#ps-grad-pergamino)" />

  <!-- ANCLA: area de arte. Llega hasta el borde inferior del marco. El codigo
       dibuja aqui el marco, el degradado de fondo y la imagen (recorte "cover"). -->
  <rect id="ph-arte" x="40" y="120" width="420" height="560" fill="{{COLOR}}" opacity="0.15" />

  <!-- Marco exterior (por encima del arte) -->
  <rect x="15" y="15" width="470" height="670" fill="none" stroke="#4d2c1b" stroke-width="4" />

  <!-- Banner del titulo (nombre) sobre el arte -->
  <path d="M 30 40 H 470 L 460 75 L 470 110 H 30 L 40 75 Z"
        fill="url(#ps-grad-banner)" stroke="#4d2c1b" stroke-width="1.5" />
  <text x="250" y="82" font-family="'Albert Sans', Georgia, 'Times New Roman', serif" font-size="32"
        font-weight="bold" fill="#3a2416" text-anchor="middle">{{NOMBRE}}</text>
  <rect x="150" y="112" width="200" height="3" fill="{{COLOR}}" opacity="0.6" />

  <!-- Subtitulo (clase/monstruo) bajo el banner -->
  <text id="ph-subtitulo" x="250" y="134" font-family="'Albert Sans', Georgia, 'Times New Roman', serif"
        font-size="15" text-anchor="middle" fill="#3a2416">{{SUBTITULO}}</text>

  <!-- ANCLA: banda inferior donde se coloca el cuadro de estadisticas
       (plantilla stats_cuadro.svg), superpuesto sobre el arte. -->
  <rect id="ph-stats" x="40" y="608" width="420" height="60" fill="#fbf6ea" opacity="0.30" />
</svg>

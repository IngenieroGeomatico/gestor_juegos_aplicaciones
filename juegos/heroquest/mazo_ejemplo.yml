# Ejemplo de mazo para imprimir con imprimir_cartas.py
#
#   uv run juegos/heroquest/scripts/imprimir_cartas.py --lista juegos/heroquest/mazo_ejemplo.yml
#
# Solo se imprimen héroes (personajes con receta de plantillas en su JSON).
# Cada entrada es "personaje: Nombre" (o simplemente "Nombre"). El campo
# "cantidad" (opcional) imprime varias copias.
cartas:
  - personaje: Bárbaro
